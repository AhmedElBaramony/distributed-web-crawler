<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Distributed Web Crawler Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      transition: background 0.3s, color 0.3s;
    }
    .log-box {
      height: 300px;
      overflow-y: auto;
      background: #212529;
      color: #f8f9fa;
      border: 1px solid #343a40;
      padding: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      width: 100%;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
      border-radius: 6px;
    }
    .status-indicator {
      font-size: 1.1rem;
      font-weight: 500;
    }
    .search-section {
      background: #fff;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
    }
    .navbar-dark .navbar-brand {
      font-weight: bold;
      letter-spacing: 1px;
    }
    .footer {
      margin-top: 2rem;
      padding: 1rem 0;
      background: #212529;
      color: #fff;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }
    .dark-mode body {
      background: #181a1b !important;
      color: #e9ecef !important;
    }
    .dark-mode .search-section, .dark-mode .card, .dark-mode .log-box {
      background: #23272b !important;
      color: #e9ecef !important;
      border-color: #343a40 !important;
    }
    .dark-mode .footer {
      background: #111315 !important;
      color: #e9ecef !important;
    }
    .dark-mode .navbar {
      background: #181a1b !important;
    }
    .dark-mode .list-group-item {
      background: #23272b !important;
      color: #e9ecef !important;
    }
    .dark-mode .form-control {
      background: #23272b !important;
      color: #e9ecef !important;
      border-color: #343a40 !important;
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><i class="bi bi-globe2"></i> Distributed Web Crawler</a>
    <button class="btn btn-outline-light ms-auto" id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon"></i></button>
  </div>
</nav>

<div class="container py-4">
  <!-- 🌍 Global Metrics -->
  <div class="row mb-4" id="global-metrics">
    <!-- Populated by JS -->
  </div>

  <!-- 🔍 Search -->
  <div class="search-section mb-4">
    <h5><i class="bi bi-search"></i> Search Indexed Content</h5>
    <div class="input-group mb-2">
      <input type="text" class="form-control" id="search-input" placeholder="Type keywords and hit Enter">
    </div>
    <ul id="search-results" class="list-group"></ul>
  </div>

  <!-- 📊 Status Section -->
  <div class="row mb-4" id="status-cards">
    <!-- Populated by JS -->
  </div>

  <!-- 📜 Logs Section -->
  <div class="row">
    {% for node in node_ids if node != 'combined' %}
    <div class="col-12 mb-4">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white d-flex align-items-center">
          <i class="bi bi-terminal me-2"></i>
          <span class="fw-bold">{{ node|capitalize }} Logs</span>
        </div>
        <div class="card-body p-2">
          <div id="log-{{ node }}" class="log-box"></div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <span>Distributed Web Crawler &copy; 2024 &mdash; University Project</span>
</div>

<script>
  const nodeRoles = JSON.parse('{{ node_roles | tojson | safe }}');
  const nodeIds = Object.keys(nodeRoles);
  const POLL_INTERVAL_MS = 3000;

  document.addEventListener("DOMContentLoaded", () => {
    updateMetrics();
    updateLogs();
    setInterval(updateMetrics, POLL_INTERVAL_MS);
    setInterval(updateLogs, POLL_INTERVAL_MS);

    const input = document.getElementById("search-input");
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        fetch(`/api/search?q=${encodeURIComponent(input.value)}`)
          .then(res => res.json())
          .then(data => {
            const container = document.getElementById("search-results");
            container.innerHTML = "";
            if (data.length === 0) {
              container.innerHTML = "<li class='list-group-item text-muted'>No results found.</li>";
              return;
            }
            data.forEach(url => {
              container.innerHTML += `<li class="list-group-item"><a href="${url}" target="_blank"><i class='bi bi-link-45deg'></i> ${url}</a></li>`;
            });
          });
      }
    });

    // Dark mode toggle
    const darkModeToggle = document.getElementById('darkModeToggle');
    darkModeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark-mode');
      const icon = darkModeToggle.querySelector('i');
      if (document.documentElement.classList.contains('dark-mode')) {
        icon.classList.remove('bi-moon');
        icon.classList.add('bi-brightness-high');
      } else {
        icon.classList.remove('bi-brightness-high');
        icon.classList.add('bi-moon');
      }
    });
  });

  function updateLogs() {
    nodeIds.forEach(nodeId => {
      fetch(`/api/logs/${nodeId}`)
        .then(res => res.json())
        .then(data => {
          const logBox = document.getElementById(`log-${nodeId}`);
          if (logBox) {
            logBox.innerText = data.join("\n");
            logBox.scrollTop = logBox.scrollHeight;
          }
        });
    });
  }

  function updateMetrics() {
    fetch("/api/metrics")
      .then(res => res.json())
      .then(data => {
        // Global metrics
        const globalPanel = document.getElementById("global-metrics");
        globalPanel.innerHTML = `
          <div class="col-12 mb-3">
            <div class="card bg-info-subtle border-0 shadow-sm">
              <div class="card-body d-flex flex-wrap justify-content-between">
                <div><strong>🌍 Total Pages Crawled:</strong> ${data.total_pages_crawled}</div>
                <div><strong>📦 Total URLs Indexed:</strong> ${data.total_urls_indexed}</div>
                <div><strong>🟢 Active Nodes:</strong> ${data.active_nodes}</div>
              </div>
            </div>
          </div>
        `;

        const panel = document.getElementById("status-cards");
        panel.innerHTML = "";

        const statuses = data.heartbeat_status;
        const crawled = data.pages_crawled;
        const indexed = data.urls_indexed;
        const heartbeats = data.heartbeat_counts;

        nodeIds.forEach(node => {
          const role = nodeRoles[node];
          const online = statuses[node] === "online";
          let badge = online ? '<span class="badge bg-success"><i class="bi bi-check-circle"></i> Online</span>' : '<span class="badge bg-danger"><i class="bi bi-x-circle"></i> Offline</span>';
          let icon = role === 'crawler' ? 'bi-hdd-network' : (role === 'indexer' ? 'bi-archive' : 'bi-person-badge');
          let html = `
            <div class="col-md-3 mb-3">
              <div class="card shadow-sm border-0 h-100">
                <div class="card-body py-2">
                  <h6 class="card-title text-uppercase"><i class="bi ${icon} me-1"></i> ${node}</h6>
                  <p class="status-indicator mb-1">${badge}</p>
                  ${role === 'crawler' ? `<p class="mb-1">💓 Heartbeats: <span class="fw-bold">${heartbeats[node] || 0}</span></p><p class="mb-0">📄 Crawled: <span class="fw-bold">${crawled[node] || 0}</span></p>` : ''}
                  ${role === 'indexer' ? `<p class="mb-0">📦 Indexed: <span class="fw-bold">${indexed[node] || 0}</span></p>` : ''}
                </div>
              </div>
            </div>`;
          panel.insertAdjacentHTML("beforeend", html);
        });
      });
  }
</script>
</body>
</html>
